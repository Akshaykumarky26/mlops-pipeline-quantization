name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - docker_ci # This workflow will trigger on pushes to the 'docker_ci' branch

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest
    steps: # This 'steps:' needs to be indented two spaces from 'runs-on:'
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python environment and install dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install -r requirements.txt

      - name: Run train.py to generate model file
        run: python train.py

      - name: Build Docker image
        run: docker build -t mlops-quantization-model .

      - name: Run Docker container for verification
        run: docker run mlops-quantization-model python predict.py

  push_to_dockerhub:
    needs: build_and_test_container
    runs-on: ubuntu-latest
    steps: # This 'steps:' also needs correct indentation
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python environment (again for the model generation if needed, or if separated)
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install -r requirements.txt

      - name: Run train.py to generate model file (needed before building image to include model)
        run: python train.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image for push
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mlops-quantization-model:latest .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/mlops-quantization-model:latest